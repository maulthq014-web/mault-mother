<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mault Jobs</title><style>body{font-family:sans-serif;padding:24px;max-width:700px;margin:auto}input,textarea,select{width:100%;padding:10px;margin:6px 0;border:1px solid #ccc;border-radius:8px}button{background:#000;color:#fff;padding:12px 18px;border-radius:8px;border:0}</style></head><body><a href="../">← Home - Mother OS</a><h1>JOBS - Western Cape</h1><p>Post Job / Upload CV - All CVs to maulthq014@gmail.com - You forward to employers R100 placement</p><form onsubmit="send(event)"><input id="name" placeholder="Full Name" required><input id="contact" placeholder="Phone / Email" required><select id="type"><option>Looking for Job - Send CV</option><option>Employer - Post Job</option></select><input id="skill" placeholder="Skill / Job Title e.g. Driver, Cashier, Cleaner"><textarea id="msg" placeholder="Experience, Location, License" required></textarea><button>Send to maulthq014@gmail.com</button></form><div id="fb" style="display:none;border:1px dashed #000;padding:10px;margin-top:10px"><pre id="ct"></pre></div><script>function send(e){e.preventDefault();const n=document.getElementById('name').value;const c=document.getElementById('contact').value;const t=document.getElementById('type').value;const s=document.getElementById('skill').value;const m=document.getElementById('msg').value;const sub='JOBS - '+t+' - '+n+' - '+s;const body='Module: Jobs%0AName: '+n+'%0AContact: '+c+'%0AType: '+t+'%0ASkill: '+s+'%0ADetails: '+m;window.open('mailto:maulthq014@gmail.com?subject='+encodeURIComponent(sub)+'&body='+body);document.getElementById('ct').innerText='To: maulthq014@gmail.com\nSubject: '+sub+'\n\nModule: Jobs\nName: '+n+'\nContact: '+c+'\nType: '+t+'\nSkill: '+s+'\nDetails: '+m;document.getElementById('fb').style.display='block';}</script></body></html>
