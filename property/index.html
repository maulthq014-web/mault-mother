<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mault Housing</title><style>body{font-family:sans-serif;padding:24px;max-width:700px;margin:auto}input,textarea,select{width:100%;padding:10px;margin:6px 0;border:1px solid #ccc;border-radius:8px}button{background:#000;color:#fff;padding:12px 18px;border-radius:8px;border:0}</style></head><body><a href="../">← Home - Mother OS</a><h1>HOUSING - Student Rooms</h1><p>NSFAS rooms, Stellenbosch, Bellville, Khayelitsha - Inquiries to maulthq014@gmail.com</p><form onsubmit="send(event)"><input id="name" placeholder="Full Name" required><input id="contact" placeholder="Phone / Email" required><select id="need"><option>Need Room - Student</option><option>Landlord - List My Room</option></select><input id="area" placeholder="Area e.g. Stellenbosch, Bellville"><input id="budget" placeholder="Budget e.g. R2500 NSFAS"><textarea id="msg" placeholder="Details - When needed, sharing?" required></textarea><button>Send to maulthq014@gmail.com</button></form><div id="fb" style="display:none;border:1px dashed #000;padding:10px;margin-top:10px"><pre id="ct"></pre></div><script>function send(e){e.preventDefault();const n=document.getElementById('name').value;const c=document.getElementById('contact').value;const ne=document.getElementById('need').value;const ar=document.getElementById('area').value;const b=document.getElementById('budget').value;const m=document.getElementById('msg').value;const sub='HOUSING - '+ne+' - '+n+' - '+ar;const body='Module: Housing%0AName: '+n+'%0AContact: '+c+'%0ANeed: '+ne+'%0AArea: '+ar+'%0ABudget: '+b+'%0ADetails: '+m;window.open('mailto:maulthq014@gmail.com?subject='+encodeURIComponent(sub)+'&body='+body);document.getElementById('ct').innerText='To: maulthq014@gmail.com\nSubject: '+sub+'\n\nModule: Housing\nName: '+n+'\nContact: '+c+'\nNeed: '+ne+'\nArea: '+ar+'\nBudget: '+b+'\nDetails: '+m;document.getElementById('fb').style.display='block';}</script></body></html>
