<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mault Health</title><style>body{font-family:sans-serif;padding:24px;max-width:700px;margin:auto}input,textarea,select{width:100%;padding:10px;margin:6px 0;border:1px solid #ccc;border-radius:8px}button{background:#000;color:#fff;padding:12px 18px;border-radius:8px;border:0}</style></head><body><a href="../">← Home</a><h1>HEALTH</h1><p>Clinic Booking / Home Nurse / Wellness - to maulthq014@gmail.com</p><form onsubmit="send(event)"><input id="name" placeholder="Full Name" required><input id="contact" placeholder="Phone / Email" required><select id="service"><option>Clinic Booking</option><option>Home Nurse</option><option>Wellness Check</option><option>Elderly Care</option></select><input id="loc" placeholder="Location e.g. Khayelitsha"><textarea id="msg" placeholder="Health need details" required></textarea><button>Send to maulthq014@gmail.com</button></form><div id="fb" style="display:none;border:1px dashed #000;padding:10px"><pre id="ct"></pre></div><script>function send(e){e.preventDefault();const n=document.getElementById('name').value;const c=document.getElementById('contact').value;const s=document.getElementById('service').value;const l=document.getElementById('loc').value;const m=document.getElementById('msg').value;const sub='HEALTH - '+n+' - '+s;const body='Module: Health%0AName: '+n+'%0AContact: '+c+'%0AService: '+s+'%0ALocation: '+l+'%0ADetails: '+m;window.open('mailto:maulthq014@gmail.com?subject='+encodeURIComponent(sub)+'&body='+body);document.getElementById('ct').innerText='To: maulthq014@gmail.com\nSubject: '+sub+'\n\nModule: Health\nName: '+n+'\nContact: '+c+'\nService: '+s+'\nLocation: '+l+'\nDetails: '+m;document.getElementById('fb').style.display='block';}</script><p style="font-size:11px">R199/m | Bundle 8 R899/m | maulthq014@gmail.com</p></body></html>
